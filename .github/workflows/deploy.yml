name: Deploy production
on:
  push:
    branches: [prod]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-prod
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  containers:
    uses: ./.github/workflows/docker.yml
  deploy:
    needs: [checks, containers]
    if: github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Publicar os quatro serviços no servidor Mais Acesso
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ -z "$DEPLOY_HOST" || -z "$DEPLOY_USER" || -z "$DEPLOY_SSH_KEY" ]]; then
            echo "Cadastre DEPLOY_HOST, DEPLOY_USER e DEPLOY_SSH_KEY nos secrets do repositório." >&2
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          path="${DEPLOY_PATH:-/home/cloud/Travessia}"
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$GITHUB_WORKSPACE/deploy/ssh_known_hosts" \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -euo pipefail; cd '$path'; git fetch origin prod; git merge-base --is-ancestor '$DEPLOY_SHA' origin/prod; git checkout -B prod '$DEPLOY_SHA'; bash scripts/deploy-prod.sh"
      - name: Conferir HTTPS, páginas públicas, arquivos estáticos e acesso anônimo
        run: node scripts/check-production.mjs
