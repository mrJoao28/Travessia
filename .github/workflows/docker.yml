name: Docker Linux
on:
  workflow_call:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: travessia-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Preparar configuração efêmera sem credenciais pessoais
        run: |
          node scripts/docker-setup.mjs
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import { parseEnv } from 'node:util';
          const settings = parseEnv(readFileSync('.env.docker', 'utf8'));
          for (const key of ['POSTGRES_PASSWORD', 'DATABASE_URL', 'BETTER_AUTH_SECRET', 'DEMO_USER_PASSWORD'])
            console.log(`::add-mask::${settings[key]}`);
          JS
          node scripts/docker-compose.mjs config --quiet
      - name: Construir imagens, iniciar PostgreSQL, migrar e subir aplicações
        run: npm run docker:up
      - name: Criar demonstração isolada pela imagem de produção
        run: npm run docker:seed
      - name: Verificar parser e OCR reais com arquivos seguros e maliciosos de teste
        run: node scripts/docker-compose.mjs run --rm --no-deps --entrypoint /opt/material-venv/bin/python material-worker apps/api/material-tools/test_process.py
      - name: Testar os quatro containers reais
        run: npm run docker:smoke
      - name: Conferir marcação, idioma, paginação e áudio dos artefatos reais
        run: node scripts/docker-compose.mjs run --rm --no-deps --entrypoint /opt/material-venv/bin/python material-worker apps/api/material-tools/verify_smoke_artifacts.py
      - name: Recriar containers preservando o volume
        run: |
          npm run docker:down
          npm run docker:start
          node scripts/docker-smoke.mjs --verify-persistence
      - name: Instalar navegador para o fluxo completo da imagem de produção
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Professor cria e adapta missão, aluno realiza e recebe feedback nos quatro containers reais
        run: node scripts/test-docker-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coherent-flow-previews
          path: test-results/reference-coherent-*.png
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: material-processing-previews
          path: test-results/materials/
          if-no-files-found: ignore
          retention-days: 7
      - name: Diagnóstico limitado em caso de falha
        if: failure()
        run: |
          node scripts/docker-compose.mjs ps
          node scripts/docker-compose.mjs logs --no-color --tail 100
      - name: Remover apenas recursos efêmeros deste job
        if: always()
        run: node scripts/docker-compose.mjs down --volumes --remove-orphans
