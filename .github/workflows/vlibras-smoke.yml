name: VLibras service smoke
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/web/**/navigation-libras*"
      - "tests/browser-vlibras/**"
      - "playwright.vlibras.config.ts"
      - ".github/workflows/vlibras-smoke.yml"
permissions:
  contents: read
jobs:
  official-widget:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config=playwright.vlibras.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vlibras-service-preview
          path: test-results/
          retention-days: 7
