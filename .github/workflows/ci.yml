name: Foundation checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run contracts:generate
      - run: git diff --exit-code -- packages/contracts/openapi.json packages/contracts/src/api.d.ts
      - run: node apps/web/scripts/generate-api.mjs
      - run: git diff --exit-code -- apps/web/lib/api.generated.ts
      - run: npm run test:api
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - run: node node_modules/tsx/dist/cli.mjs --tsconfig apps/api/tsconfig.json apps/web/scripts/test-real-demo.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-previews
          path: test-results/reference-*.png
          if-no-files-found: ignore
          retention-days: 7
